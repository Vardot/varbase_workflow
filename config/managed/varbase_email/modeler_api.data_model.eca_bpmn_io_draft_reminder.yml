  <?xml version="1.0" encoding="UTF-8"?>
  <bpmn2:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:camunda="http://camunda.org/schema/1.0/bpmn" xmlns:qa="http://some-company/schema/bpmn/qa" id="sample-diagram" targetNamespace="http://bpmn.io/schema/bpmn" xsi:schemaLocation="http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd">
    <bpmn2:process id="draft_reminder" name="Draft Reminder" isExecutable="false" camunda:versionTag="1.0.0">
      <bpmn2:documentation>Send a monthly email reminder for drafts older than 1 month.</bpmn2:documentation>
      <bpmn2:extensionElements>
        <camunda:properties>
          <camunda:property name="Tags" value="cron,email,drafts,reminder" />
          <camunda:property name="Changelog" value="Initialization" />
        </camunda:properties>
      </bpmn2:extensionElements>
      <bpmn2:startEvent id="eca_base__eca_cron_1_1" name="Cron to check on outdated drafts" camunda:modelerTemplate="org.drupal.event.eca_base:eca_cron">
        <bpmn2:extensionElements>
          <camunda:field name="frequency">
            <camunda:string>0 2 * * *</camunda:string>
          </camunda:field>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_base:eca_cron" />
          </camunda:properties>
        </bpmn2:extensionElements>
        <bpmn2:outgoing>Flow_00mwnhd</bpmn2:outgoing>
      </bpmn2:startEvent>
